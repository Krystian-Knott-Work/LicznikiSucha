<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liczniki Sucha">
<link rel="manifest" href="manifest.json">
<title>Liczniki Sucha</title>
<style>
:root{
  color-scheme:light;
  --bg:#f1f5f9;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --navy:#0b1120;
  --accent:#2563eb;
  --accent-soft:#eff6ff;
  --green:#059669;
  --green-soft:#ecfdf5;
  --red:#dc2626;
  --red-soft:#fef2f2;
  --amber:#d97706;
  --amber-soft:#fffbeb;
  --radius:20px;
  --shadow:0 10px 25px -5px rgba(15,23,42,.06), 0 4px 10px -6px rgba(15,23,42,.04);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  padding:0 0 calc(104px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}

/* Header */
header{
  background:linear-gradient(160deg, var(--navy) 0%, #172554 100%);
  color:#fff;
  padding:22px 18px 28px;
  border-radius:0 0 28px 28px;
  box-shadow:0 12px 30px -10px rgba(11,17,32,.35);
}
.header-inner{max-width:860px;margin:0 auto}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;text-transform:uppercase;letter-spacing:.12em;
  color:#93c5fd;font-weight:700;
}
h1{font-size:26px;letter-spacing:-.03em;margin:6px 0 3px;font-weight:800}
.sub{color:#cbd5e1;font-size:13px;margin:0}
.header-badges{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{
  font-size:12px;font-weight:600;color:#e2e8f0;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);
  padding:6px 11px;border-radius:999px;white-space:nowrap;backdrop-filter:blur(8px);
}
.sync-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  color:#bfdbfe;font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;
  cursor:pointer;transition:.15s;
}
.sync-btn:hover{background:rgba(255,255,255,.16);color:#fff}

/* Layout */
main{max-width:860px;margin:-14px auto 0;padding:0 14px 16px}
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:18px;margin-bottom:14px;
  box-shadow:var(--shadow);
}

/* Date & Drafts bar */
.meta-grid{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.date-box{display:flex;align-items:center;gap:12px}
.date-box label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=date]{
  border:1px solid var(--line);background:var(--surface-2);
  border-radius:12px;padding:10px 12px;font:600 15px inherit;color:var(--ink);
  outline:none;transition:.15s;
}
input[type=date]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.status{font-size:12.5px;color:var(--muted)}

.drafts-bar{
  display:none;flex-wrap:wrap;align-items:center;gap:8px;
  margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
}
.drafts-title{font-size:12px;font-weight:700;color:var(--amber)}
.draft-chip{
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;
  transition:.15s;
}
.draft-chip:hover{border-color:#94a3b8}
.draft-chip.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* Trend KPI Cards */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-bottom:14px;
}
@media(min-width:680px){.kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}}
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;gap:8px;
}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi-title{font-size:12px;font-weight:700;color:var(--muted)}
.kpi-val{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-unit{font-size:12px;font-weight:600;color:var(--muted)}
.trend{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;width:fit-content;
}
.trend.up{background:var(--red-soft);color:var(--red)}
.trend.down{background:var(--green-soft);color:var(--green)}
.trend.flat{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.kpi-sub{font-size:11px;color:var(--muted)}

/* Sections & Tables */
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.section-title{display:flex;align-items:center;gap:12px}
.symbol{
  width:40px;height:40px;border-radius:14px;
  background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:18px;font-weight:700;flex-shrink:0;
}
.section-head h2{font-size:17px;margin:0;letter-spacing:-.02em;font-weight:750}
.section-head p{font-size:12.5px;color:var(--muted);margin:2px 0 0}

table{width:100%;border-collapse:separate;border-spacing:0 8px}
th{
  text-align:right;color:var(--muted);font-size:11px;text-transform:uppercase;
  letter-spacing:.07em;font-weight:700;padding:0 8px 2px;
}
th:first-child{text-align:left;padding-left:6px}
td{
  padding:8px 8px;text-align:right;background:var(--surface-2);
  border-top:1px solid #edf2f7;border-bottom:1px solid #edf2f7;vertical-align:middle;
}
td:first-child{
  text-align:left;border-left:1px solid #edf2f7;
  border-radius:14px 0 0 14px;width:68px;font-weight:800;padding-left:14px;color:var(--ink);
}
td:last-child{border-right:1px solid #edf2f7;border-radius:0 14px 14px 0}

.cell-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.reading{
  width:100%;max-width:175px;
  border:1px solid #cbd5e1;background:#fff;border-radius:11px;
  padding:9px 10px;text-align:right;
  font:700 16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);
  outline:none;transition:.15s;
}
.reading:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.reading::placeholder{color:#cbd5e1}
.reading.invalid{border-color:var(--red);background:#fff5f5}

.meta-line{
  display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px;
  font-size:11px;color:var(--muted);min-height:18px;
}
.delta-pill{font-weight:700;padding:1px 6px;border-radius:6px}
.delta-pill.up{background:var(--red-soft);color:var(--red)}
.delta-pill.down{background:var(--green-soft);color:var(--green)}
.delta-pill.flat{background:#e2e8f0;color:#475569}

/* Gas card */
.gas-box{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;
  background:var(--surface-2);border:1px solid #edf2f7;border-radius:14px;padding:12px 14px;
}
.gas-label{font-size:13px;font-weight:700;color:var(--ink)}
.gas-sub{font-size:12px;color:var(--muted)}

/* Actions & Bottom bar */
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{
  border:0;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:700;
  cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.55;cursor:wait}
.btn-light{background:#e2e8f0;color:#1e293b}
.btn-light:hover{background:#cbd5e1}
.btn-amber{background:var(--amber-soft);color:#92400e;border:1px solid #fcd34d}
.btn-amber:hover{background:#fef3c7}
.btn-green{background:var(--green);color:#fff;box-shadow:0 8px 20px -6px rgba(5,150,105,.45)}
.btn-green:hover{background:#047857}

.bottom{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.9);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:10;
}
.bottom-inner{max-width:832px;margin:0 auto;display:flex;gap:10px}
.bottom .btn{flex:1;padding:15px 14px;font-size:15px}

@media(max-width:540px){
  .reading{max-width:126px;font-size:15px;padding:8px}
  td:first-child{width:54px;padding-left:10px}
  th,td{padding-left:5px;padding-right:5px}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="topline">
      <div>
        <div class="eyebrow">ul. Sucha · M1–M5</div>
        <h1>Liczniki Sucha</h1>
        <p class="sub">Szkice zapisują się lokalnie — możesz wyjść z apki i wrócić później.</p>
